<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Continuity</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--wine:#7c0919;--ink:#242123;--muted:#797479;--line:#e9e6e4;--paper:#f8f7f5;--green:#2e7355;--amber:#96631b;--shadow:0 10px 32px #1e141209}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.layout{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:23px 15px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:9px;padding:0 8px;font:800 16px Manrope;letter-spacing:-.6px;text-decoration:none}.mark{width:30px;height:30px;border-radius:9px;background:var(--wine);color:white;display:grid;place-items:center}.workspace{padding:12px;border:1px solid var(--line);border-radius:11px}.workspace small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.workspace b{font-size:11px}.nav-label{padding:0 10px;font-size:9px;color:#9a9598;text-transform:uppercase;letter-spacing:1.3px;font-weight:700}.nav{display:grid;gap:4px;margin-top:-20px}.nav button{border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;color:#6f6a6f;font-size:11px}.nav button.active,.nav button:hover{background:#f7edef;color:var(--wine);font-weight:700}.badge{margin-left:auto;background:white;border:1px solid var(--line);padding:2px 6px;border-radius:12px;font-size:9px}.side-foot{margin-top:auto}.hint{background:#faf5f3;border-radius:10px;padding:13px}.hint b{font-size:10px}.hint p{font-size:9px;color:var(--muted);line-height:1.5}.profile{border-top:1px solid var(--line);padding:13px 5px 0;margin-top:13px;display:flex;align-items:center;gap:9px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e9d9d3;color:#704d44;font-size:9px;font-weight:700}.profile b{font-size:10px;display:block}.profile small{font-size:9px;color:var(--muted)}main{min-width:0}.top{height:64px;border-bottom:1px solid var(--line);background:#ffffffdf;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:4}.crumb{font-size:10px;color:var(--muted)}.crumb b{color:var(--ink)}.search{width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:10px}.button{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:#fff;font-size:10px;font-weight:600;color:#504b50}.primary{border-color:var(--wine);background:var(--wine);color:white}.canvas{max-width:1170px;margin:auto;padding:30px 32px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--wine);font-weight:700}.hero h1{font:700 28px Manrope;letter-spacing:-.8px;margin:8px 0 5px}.hero p{font-size:11px;color:var(--muted);margin:0;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.stat{padding:13px 15px}.stat span{font-size:10px;color:var(--muted)}.stat b{display:block;font:700 20px Manrope;margin-top:7px}.split{display:grid;grid-template-columns:1.4fr .9fr;gap:13px}.card-head{padding:15px 16px 11px;display:flex;justify-content:space-between;align-items:center}.card-head h2{font:700 12px Manrope;margin:0}.card-head p{font-size:9px;color:var(--muted);margin:4px 0 0}.link{background:none;border:0;color:var(--wine);font-size:9px;font-weight:700}.list,.template-list{padding:0 12px 10px}.handover{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border-top:1px solid #f1efed;padding:12px 6px;cursor:pointer}.handover:hover{background:#fcfaf9}.h-icon{width:34px;height:34px;border-radius:9px;background:#f6edef;color:var(--wine);display:grid;place-items:center}.h-title,.template b{font-size:10px;font-weight:700}.h-meta,.template small{font-size:9px;color:var(--muted);margin-top:4px}.h-end{text-align:right}.state,.status{display:inline-block;padding:4px 7px;border-radius:14px;font-size:8px;font-weight:700;background:#f0eff1;color:#706c73}.state.Published,.status.Found{background:#eaf4ed;color:var(--green)}.state.Draft,.status.Missing{background:#f0eff1;color:#706c73}.state.In.review,.status.Inferred{background:#fff4e2;color:var(--amber)}.small{font-size:8px;color:var(--muted);margin-top:5px}.template{border-top:1px solid #f1efed;padding:10px 0;display:flex;justify-content:space-between;gap:8px}.template b{display:block}.template button{font-size:9px;color:var(--wine);border:0;background:none;font-weight:700}.empty{padding:25px;text-align:center;color:var(--muted);font-size:10px;line-height:1.6}.lower{margin-top:13px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.note{padding:13px 16px;font-size:10px;line-height:1.7;color:var(--muted)}.note b{color:var(--ink)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{border:1px solid var(--line);border-radius:14px;padding:4px 7px;font-size:8px;color:#676168}.modal-bg{position:fixed;inset:0;background:#17131577;backdrop-filter:blur(3px);z-index:10;display:none;align-items:center;justify-content:center;padding:15px}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:13px;width:min(690px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 80px #0003}.modal-head{position:sticky;top:0;background:#fff;padding:16px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;z-index:2}.modal-head h2{font:700 14px Manrope;margin:0}.x{border:0;background:none;font-size:20px;color:#777}.form{padding:18px 19px}.field{margin-bottom:13px}.field label{display:block;font-size:9px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:10px;outline:none}.field textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.detail-top{display:flex;justify-content:space-between;gap:12px;padding:4px 0 17px}.detail-top h1{font:700 23px Manrope;margin:7px 0}.tabs{display:flex;gap:15px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}.tabs button{white-space:nowrap;border:0;background:none;padding:9px 3px;font-size:9px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--wine);font-weight:700;border-color:var(--wine)}.field-card{border:1px solid var(--line);border-radius:9px;margin:8px 0;background:white}.field-top{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid #f3f1ef}.field-top b{font-size:10px}.field-content{padding:11px 12px}.field-content textarea{width:100%;border:1px solid var(--line);border-radius:7px;min-height:66px;padding:8px;font-size:10px;line-height:1.55}.citation{border-left:2px solid #c69ba1;padding:7px 9px;margin:7px 0;background:#fcf9f9;color:#655e61;font-size:9px;line-height:1.55}.citation a{color:var(--wine);font-weight:700}.question,.source-row{border:1px solid var(--line);border-radius:8px;padding:11px;margin:8px 0}.question p{font-size:10px}.source-row{display:flex;align-items:center;gap:10px}.source-row b{font-size:10px}.source-row small{display:block;font-size:8px;color:var(--muted);margin-top:4px}.toast{position:fixed;z-index:30;bottom:20px;left:50%;transform:translate(-50%,15px);background:#211a1c;color:white;padding:10px 15px;border-radius:8px;font-size:10px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile{display:none}@media(max-width:900px){.layout{grid-template-columns:205px 1fr}.canvas{padding:24px 19px}.top{padding:0 19px}.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.layout{display:block}.sidebar{position:fixed;z-index:12;inset:0 auto 0 0;width:250px;transform:translateX(-105%);transition:.2s;box-shadow:12px 0 35px #0002}.sidebar.open{transform:translateX(0)}.mobile{display:inline-flex}.top{height:56px;padding:0 13px}.search{display:none}.canvas{padding:20px 13px 40px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:24px}.hero .button{width:100%;justify-content:center}.lower{grid-template-columns:1fr}.row{grid-template-columns:1fr}.detail-top{flex-direction:column}.detail-top .button{justify-content:center}.handover{grid-template-columns:32px 1fr}.h-end{grid-column:2;display:flex;justify-content:space-between}.nav{margin-bottom:4px}}
</style><style>.status.Manual{background:#eef0f8;color:#53628b}</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"><a class="brand" href="/"><span class="mark">K</span>Knowledge Continuity</a><div class="workspace"><small>WORKSPACE</small><b>Human Value Calculator　⌄</b></div><div class="nav-label">Workspace</div><nav class="nav"><button class="active" data-page="home">▦ &nbsp; Overview</button><button data-page="handovers">↗ &nbsp; Handovers <span class="badge" id="handoverCount">0</span></button><button data-page="templates">▤ &nbsp; Templates</button><button data-page="qa">✳ &nbsp; Handover Q&amp;A</button><button data-page="team">Team accounts</button><button onclick="logout()">Sign out</button></nav><div class="side-foot"><div class="hint"><b>Keep context with the work</b><p>Interns add project sources. Senior engineers review evidence before sharing.</p></div><div class="profile"><div class="avatar" id="adminAvatar">A</div><div><b id="adminName">Workspace owner</b><small id="adminEmail">Admin</small></div></div></div></aside><main><header class="top"><div style="display:flex;align-items:center;gap:9px"><button class="button mobile" id="menu">☰</button><span class="crumb">Workspace / <b id="crumb">Overview</b></span></div><div style="display:flex;align-items:center;gap:10px"><input class="search" id="search" placeholder="⌕ Search handovers"><div class="avatar" id="topAvatar">A</div></div></header><section class="canvas" id="canvas"><div class="empty">Loading workspace…</div></section></main></div><div class="modal-bg" id="modal"><div class="modal" id="modalContent"></div></div><div class="toast" id="toast"></div>
<script>
const API='/api/kc';let templates=[],handovers=[],current=null,tab='content',pageName='home',caps={},me=null,team=[];const canvas=document.getElementById('canvas');
async function api(path,options={}){const headers={...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(options.headers||{})};const r=await fetch(API+path,{...options,headers});let d;try{d=await r.json()}catch{d={detail:r.statusText}}if(!r.ok)throw Error(d.detail||`Request failed ${r.status}`);return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('show'),3200)}
async function refresh(){[templates,handovers,caps]=await Promise.all([api('/templates'),api('/handovers'),api('/capabilities')]);me=(await api('/auth/me')).user;document.getElementById('handoverCount').textContent=handovers.length;document.getElementById('adminName').textContent=me.display_name;document.getElementById('adminEmail').textContent=me.email;document.getElementById('adminAvatar').textContent=me.display_name.split(' ').map(x=>x[0]).join('').slice(0,2);document.getElementById('topAvatar').textContent=me.display_name.split(' ').map(x=>x[0]).join('').slice(0,2);render()}
function go(p){pageName=p;render();document.getElementById('sidebar').classList.remove('open')}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===pageName));document.getElementById('crumb').textContent=({home:'Overview',handovers:'Handovers',templates:'Templates',qa:'Handover Q&A',team:'Team accounts',detail:current?.handover.title||'Handover'}[pageName]);if(pageName==='home')home();if(pageName==='handovers')handoverList();if(pageName==='templates')templatePage();if(pageName==='detail')detailPage();if(pageName==='qa')globalQa();if(pageName==='team')teamPage()}
function row(h,i){return `<div class="handover" data-id="${esc(h.id)}"><div class="h-icon">↗</div><div><div class="h-title">${esc(h.title)}</div><div class="h-meta">${esc(h.template_name)} · ${esc(h.departing_person)} → ${esc(h.recipient)} · ${h.source_count} resources</div></div><div class="h-end"><span class="state ${h.status==='In review'?'In.review':esc(h.status)}">${esc(h.status)}</span><div class="small">${h.missing_count} gaps</div></div></div>`}
function bindRows(){document.querySelectorAll('.handover').forEach(x=>x.onclick=()=>openHandover(x.dataset.id))}
function home(){const active=handovers.filter(h=>h.status!=='Published').length,published=handovers.filter(h=>h.status==='Published').length,missing=handovers.reduce((n,h)=>n+(h.missing_count||0),0);canvas.innerHTML=`<div class="hero"><div><div class="eyebrow">Team knowledge, carried forward</div><h1>Make every handover useful.</h1><p>Employees add their project resources. AI drafts the handover with evidence. Senior reviewers verify what the next engineer can rely on.</p></div><button class="button primary" onclick="newHandover()">＋ &nbsp; Start a handover</button></div><div class="stats"><div class="stat"><span>Active handovers</span><b>${active}</b></div><div class="stat"><span>Published</span><b>${published}</b></div><div class="stat"><span>Open gaps</span><b>${missing}</b></div><div class="stat"><span>Starter templates</span><b>${templates.filter(t=>t.is_default).length}</b></div></div><div class="split"><div class="card"><div class="card-head"><div><h2>Recent handovers</h2><p>Owner-reviewed context for the next person</p></div><button class="link" onclick="go('handovers')">View all →</button></div><div class="list">${handovers.slice(0,5).map(row).join('')||'<div class="empty">No handovers yet.<br>Choose the software handover template, add project sources, and ask the intern to fill the gaps.</div>'}</div></div><div class="card"><div class="card-head"><div><h2>Start with a template</h2><p>Editable starting points for common handovers</p></div><button class="link" onclick="go('templates')">All templates →</button></div><div class="template-list">${templates.filter(t=>t.is_default).sort((a,b)=>(b.id==='software-project')-(a.id==='software-project')).slice(0,5).map(t=>`<div class="template"><div><b>${esc(t.name)}</b><small>${esc(t.description)}</small></div><button onclick="newHandover('${t.id}')">Use ↗</button></div>`).join('')}</div></div></div><div class="lower"><div class="card"><div class="card-head"><div><h2>What a strong handover captures</h2><p>Designed around continuity, not paperwork</p></div></div><div class="note">Capture <b>what is happening, why decisions were made, what is unfinished, who owns the next step, and where the source of truth lives.</b><div class="tags"><span class="tag">Decisions & rationale</span><span class="tag">Open work & owners</span><span class="tag">Risks & dependencies</span><span class="tag">Contacts & resources</span></div></div></div><div class="card"><div class="card-head"><div><h2>Answers from project sources</h2><p>Answer from project references</p></div></div><div class="note">Handover Q&amp;A searches supplied resources. Answers include source references; if evidence is missing, the assistant says so and points back to the owner.</div></div></div>`;bindRows()}
function handoverList(){canvas.innerHTML=`<div class="hero"><div><div class="eyebrow">Continuity workspace</div><h1>Handovers</h1><p>Project context being prepared, reviewed, or shared.</p></div><button class="button primary" onclick="newHandover()">＋ &nbsp; Start a handover</button></div><div class="card"><div class="card-head"><div><h2>All handovers</h2><p>${handovers.length} total</p></div></div><div class="list">${handovers.map(row).join('')||'<div class="empty">No handovers. Start one from an editable template.</div>'}</div></div>`;bindRows()}
function templatePage(){canvas.innerHTML=`<div class="hero"><div><div class="eyebrow">Flexible structure</div><h1>Handover templates</h1><p>Use a researched starting point, then tailor fields to your team.</p></div><button class="button primary" onclick="editTemplate()">＋ &nbsp; Create template</button></div><div class="split">${templates.map(t=>`<div class="card"><div class="card-head"><div><h2>${esc(t.name)}</h2><p>${esc(t.description)}</p></div><button class="link" onclick="editTemplate('${t.id}')">${t.is_default?'Customize':'Edit'} ↗</button></div><div class="template-list">${t.fields.map(f=>`<div class="template"><div><b>${esc(f.label)} ${f.required?'<span style="color:#ad5865">*</span>':''}</b><small>${esc(f.help)}</small></div></div>`).join('')}</div></div>`).join('')}</div>`}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
async function newHandover(pre='software-project'){try{team=await api('/users');const employees=team.filter(u=>u.role==='employee'),recipients=team.filter(u=>u.role==='recipient');if(!employees.length||!recipients.length){toast('Add an Intern / Builder and Incoming Engineer account in Team accounts first');go('team');return}openModal(`<div class="modal-head"><h2>Start a developer handover</h2><button class="x" onclick="closeModal()">×</button></div><form class="form" id="newForm"><div class="field"><label>Choose an editable template</label><select name="template_id" required>${templates.map(t=>`<option value="${t.id}" ${t.id===pre?'selected':''}>${esc(t.name)}${t.is_default?' · starter':''}</option>`).join('')}</select></div><div class="field"><label>Project or feature</label><input name="title" placeholder="e.g. Human Value Calculator · feature handoff"></div><div class="row"><div class="field"><label>Assign intern / builder</label><select name="employee_id" required>${employees.map(u=>`<option value="${u.id}">${esc(u.display_name)} · ${esc(u.email)}</option>`).join('')}</select></div><div class="field"><label>Assign incoming engineer</label><select name="recipient_id" required>${recipients.map(u=>`<option value="${u.id}">${esc(u.display_name)} · ${esc(u.email)}</option>`).join('')}</select></div></div><button class="button primary" type="submit">Create assigned handover →</button></form>`);document.getElementById('newForm').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target)),emp=employees.find(u=>u.id===data.employee_id),rec=recipients.find(u=>u.id===data.recipient_id);data.departing_person=emp.display_name;data.recipient=rec.display_name;data.owner=me.display_name;const h=await api('/handovers',{method:'POST',body:JSON.stringify(data)});closeModal();await refresh();openHandover(h.handover.id)}catch(x){toast(x.message)}}}catch(e){toast(e.message)}}
function fieldEditor(f){return `<div class="ef row" style="align-items:end;border-top:1px solid var(--line);padding-top:10px"><div class="field"><label>Field name</label><input class="flabel" value="${esc(f.label)}" required><input class="fkey" type="hidden" value="${esc(f.key)}"></div><div class="field"><label>Guidance for employee</label><input class="fhelp" value="${esc(f.help||'')}"></div><label style="font-size:9px;display:flex;gap:5px;align-items:center;margin-bottom:13px"><input class="freq" type="checkbox" ${f.required?'checked':''}> Required</label><button class="link" type="button" onclick="this.closest('.ef').remove()">Remove</button></div>`}
function addEditorField(){document.getElementById('fieldEditor').insertAdjacentHTML('beforeend',fieldEditor({label:'',help:'',required:false,key:'field_'+Date.now()}))}
function editTemplate(id=''){const original=templates.find(t=>t.id===id),t=original?JSON.parse(JSON.stringify(original)):{name:'',description:'',category:'Custom',fields:[{key:'summary',label:'Project summary',help:'Purpose and current status.',required:true}]};if(t.is_default){t.id='';t.name+=' (custom)'}openModal(`<div class="modal-head"><h2>${original?.is_default?'Customize starter template':id?'Edit template':'Create a template'}</h2><button class="x" onclick="closeModal()">×</button></div><form class="form" id="templateForm"><div class="field"><label>Template name</label><input id="tplName" value="${esc(t.name)}" required></div><div class="field"><label>Purpose</label><input id="tplDesc" value="${esc(t.description)}"></div><div id="fieldEditor">${t.fields.map(fieldEditor).join('')}</div><button class="button" type="button" onclick="addEditorField()">＋ Add field</button><div style="display:flex;justify-content:flex-end;margin-top:15px"><button class="button primary">Save editable template</button></div></form>`);document.getElementById('templateForm').onsubmit=async e=>{e.preventDefault();const fields=[...document.querySelectorAll('.ef')].map((x,i)=>({key:x.querySelector('.fkey').value||'field_'+i,label:x.querySelector('.flabel').value,help:x.querySelector('.fhelp').value,required:x.querySelector('.freq').checked})).filter(x=>x.label.trim()),body={name:document.getElementById('tplName').value,description:document.getElementById('tplDesc').value,category:t.category||'Custom',fields};try{if(id&&!original?.is_default)await api(`/templates/${id}`,{method:'PUT',body:JSON.stringify(body)});else await api('/templates',{method:'POST',body:JSON.stringify(body)});closeModal();await refresh();go('templates');toast('Template saved')}catch(x){toast(x.message)}}}
async function openHandover(id){try{current=await api(`/handovers/${id}`);pageName='detail';tab='content';render()}catch(e){toast(e.message)}}
function detailPage(){const h=current.handover;canvas.innerHTML=`<div class="detail-top"><div><button class="link" onclick="go('handovers')">← All handovers</button><div class="eyebrow" style="margin-top:12px">${esc(h.status)} · ${current.sources.length} resource(s) ${h.acknowledged_at?'· Recipient acknowledged':''}</div><h1>${esc(h.title)}</h1><p style="font-size:10px;color:var(--muted)">${esc(h.departing_person)} → ${esc(h.recipient)} · Owner: ${esc(h.owner)}</p></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="button" onclick="document.getElementById('resourceFile').click()">＋ Add resource</button><button class="button primary" onclick="extract()">✳ Extract from sources</button><input id="resourceFile" type="file" accept=".txt,.md,.csv,.json,.log,.html,.css,.js,.jsx,.ts,.tsx,.py,.sql,.yaml,.yml,.pdf,.docx" hidden onchange="uploadResource(this.files[0])"></div></div><div class="tabs"><button class="${tab==='content'?'active':''}" onclick="tab='content';render()">Handover fields</button><button class="${tab==='sources'?'active':''}" onclick="tab='sources';render()">Resources (${current.sources.length})</button><button class="${tab==='questions'?'active':''}" onclick="tab='questions';render()">Questions (${current.questions.filter(q=>q.status==='Open').length})</button><button class="${tab==='qa'?'active':''}" onclick="tab='qa';render()">Handover Q&amp;A</button><button class="${tab==='timeline'?'active':''}" onclick="tab='timeline';render()">Timeline</button><button class="${tab==='versions'?'active':''}" onclick="tab='versions';loadVersions()">Versions</button><button onclick="recipientView()">Recipient preview ↗</button></div>${tab==='content'?contentTab():tab==='sources'?sourcesTab():tab==='questions'?questionsTab():tab==='qa'?qaTab():tab==='timeline'?timelineTab():versionTab()}`}
function contentTab(){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><small style="font-size:9px;color:var(--muted)">Evidence stays attached. Senior approval is required before sharing.</small><button class="button" onclick="publish()">Publish approved view ↗</button></div>${current.fields.map(f=>`<article class="field-card"><div class="field-top"><b>${esc(f.label)} ${f.approved?'<span style="color:var(--green)">✓ Approved</span>':''}</b><span class="status ${esc(f.state)}">${esc(f.state)}</span></div><div class="field-content"><textarea id="value_${f.id}" placeholder="Add or review handover information…">${esc(f.value)}</textarea>${f.citations.map(c=>`<div class="citation"><a href="#" onclick="tab='sources';render();return false">${esc(c.passage_id)}</a> · “${esc(c.quote)}”</div>`).join('')}<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px"><label style="font-size:8px;color:var(--muted)"><input type="checkbox" id="visible_${f.id}" ${f.visible_to_recipient?'checked':''}> Share with incoming engineer after approval</label><span><button class="button" onclick="saveField('${f.id}')">Save</button> <button class="button primary" onclick="approveField('${f.id}')">Approve</button></span></div></div></article>`).join('')}`}
function sourcesTab(){return `<div class="card"><div class="card-head"><div><h2>Intern-maintained project sources</h2><p>Original uploads are saved privately and split into numbered passages for citations.</p></div><button class="button primary" onclick="document.getElementById('resourceFile').click()">＋ Add resource</button></div><div class="list">${current.sources.map(s=>`<div class="source-row"><div class="h-icon">▤</div><div><b>${esc(s.name)}</b><small>${esc(s.source_type)} · Added by ${esc(s.added_by)} · ${esc(s.audience)}</small></div>${s.download_url?`<a class="button" href="${esc(s.download_url)}">Download original</a>`:``}<button class="button" onclick="deleteSource('${s.id}')">Remove</button></div>`).join('')||'<div class="empty">Add source code, README notes, chat exports, task files, or test evidence before extraction. Avoid secrets and .env files.</div>'}</div></div><div class="card" style="margin-top:11px"><div class="card-head"><div><h2>Paste notes or an export</h2><p>Include feature status, run steps, formula assumptions, tests, known gaps, and next tasks.</p></div></div><div class="form"><div class="row"><div class="field"><label>Resource title</label><input id="pasteName" value="Project notes"></div><div class="field"><label>Added by</label><input id="pasteBy" value="Intern / builder"></div></div><div class="field"><label>Source text</label><textarea id="pasteContent" placeholder="Paste build notes, chat exports, issue context, or implementation details." style="min-height:130px"></textarea></div><button class="button primary" onclick="pasteSource()">Save & index passages</button></div></div>`}
function questionsTab(){return `<div class="card"><div class="card-head"><div><h2>Questions for the departing teammate</h2><p>Fill important gaps while context is fresh.</p></div></div><div class="form">${current.questions.map(q=>`<div class="question"><small style="color:var(--muted)">${esc(q.field_label)} · ${esc(q.status)}</small><p>${esc(q.question)}</p>${q.status==='Open'?`<textarea id="answer_${q.id}" placeholder="Add the missing context…" style="width:100%;min-height:55px;border:1px solid var(--line);border-radius:7px;padding:8px;font-size:10px"></textarea><button class="button primary" style="margin-top:6px" onclick="answerQuestion('${q.id}')">Save answer</button>`:`<div class="citation">${esc(q.answer)}</div>`}</div>`).join('')||'<div class="empty">No questions yet. Extract from resources to surface gaps.</div>'}</div></div>`}
function timelineTab(){setTimeout(loadTimeline,0);return `<div class="card"><div class="card-head"><div><h2>Project timeline</h2><p>Dated notes are shown only when their date appears in the source. Added and published timestamps are kept in a separate activity trail.</p></div></div><div id="timelineBody"><div class="empty">Loading dated project evidence...</div></div></div>`}
async function loadTimeline(){const box=document.getElementById('timelineBody');if(!box||!current)return;try{const d=await api(`/handovers/${current.handover.id}/timeline`);box.innerHTML=`<div class="timeline-list">${d.evidence.map(e=>`<article class="question"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(e.date)}</b><span class="state">${esc(e.kind)}</span><small>${esc(e.source)}</small></div><p>${esc(e.quote)}</p><small>Explicitly dated source ? ${esc(e.passage_id)}</small></article>`).join('')||'<div class="empty">No complete dates found in the current source passages. Add dated decision notes, issue exports, release notes, or commit history to build the project chronology.</div>'}</div><details style="padding:12px 15px"><summary style="cursor:pointer;font-size:10px;font-weight:700">Workspace activity (${d.activity.length})</summary><p style="font-size:9px;color:var(--muted)">${esc(d.date_rule)}</p>${d.activity.map(a=>`<div class="question"><small>${esc(a.at)}</small><p><b>${esc(a.label)}</b> ? ${esc(a.detail)}</p></div>`).join('')}</details>`}catch(e){box.innerHTML=`<div class="empty">Could not load timeline: ${esc(e.message)}</div>`}}
function qaTab(){setTimeout(loadQaHistory,0);return `<div class="split"><div class="card"><div class="card-head"><div><h2>Ask from project references</h2><p>Questions answered only from approved handover sources.</p></div></div><div class="form"><div class="field"><label>Engineer question</label><textarea id="customerQuestion" placeholder="How do I run the calculator locally?"></textarea></div><button class="button primary" onclick="askQuestion()">Find a sourced answer ✳</button><div id="answerBox"></div></div></div><div class="card"><div class="card-head"><div><h2>Answer safeguards</h2><p>Evidence before confidence</p></div></div><div class="note">Searches only this handover's resources. Shows supporting passage IDs. If evidence is missing, it abstains instead of guessing.<br><br>${caps.model_configured?'AI drafting is configured; citations are checked against source text.':'Model is not configured: demo shows relevant source excerpts. Set OPENAI_API_KEY for generated answers.'}</div></div></div><div class="card" id="qaHistory" style="margin-top:12px"><div class="empty">Loading engineer questions…</div></div>`}
async function loadQaHistory(){const box=document.getElementById('qaHistory');if(!box||!current)return;try{const rows=await api(`/handovers/${current.handover.id}/qa`);box.innerHTML=`<div class="card-head"><div><h2>Incoming engineer question log</h2><p>Unanswered questions show where the handover needs another source-backed update.</p></div></div><div class="list">${rows.map(q=>`<div class="question"><small style="color:var(--muted)">${new Date(q.created_at).toLocaleString()} · ${q.mode==='abstained'?'NEEDS FOLLOW-UP':q.mode==='source-excerpts'?'SOURCE EXCERPTS':'ANSWER DRAFT'}</small><p><b>Question:</b> ${esc(q.question)}</p><p>${esc(q.answer)}</p>${q.mode==='abstained'?'<small>Senior action: add or approve the missing context, then republish the handover.</small>':''}${q.citations.map(c=>`<div class="citation">${esc(c.passage_id)} · “${esc(c.quote)}”</div>`).join('')}</div>`).join('')||'<div class="empty">No incoming engineer questions yet.</div>'}</div>`}catch(e){box.innerHTML=`<div class="empty">Could not load question log: ${esc(e.message)}</div>`}}
function globalQa(){canvas.innerHTML=`<div class="hero"><div><div class="eyebrow">Project reference Q&amp;A</div><h1>Handover Q&amp;A</h1><p>Choose a published handover. Answers use only senior-approved information shared with the incoming engineer.</p></div></div><div class="card"><div class="list">${handovers.filter(h=>h.status==='Published').map(row).join('')||'<div class="empty">No published handovers yet. Review and publish one to enable source-grounded handover Q&amp;A.</div>'}</div></div>`;document.querySelectorAll('.handover').forEach(x=>x.onclick=()=>{tab='qa';openHandover(x.dataset.id)})}
async function saveField(id){try{await api(`/fields/${id}`,{method:'PATCH',body:JSON.stringify({value:document.getElementById(`value_${id}`).value,visible_to_recipient:document.getElementById(`visible_${id}`).checked,state:'Manual',citations:[]})});await reloadDetail();toast('Field saved as owner-edited content')}catch(e){toast(e.message)}}async function approveField(id){try{await saveField(id);await api(`/fields/${id}/approve`,{method:'POST'});await reloadDetail();toast('Owner approved field')}catch(e){toast(e.message)}}async function reloadDetail(){current=await api(`/handovers/${current.handover.id}`);pageName='detail';render()}
async function extract(){try{const r=await api(`/handovers/${current.handover.id}/extract`,{method:'POST'});await reloadDetail();toast(`Drafted ${r.fields.length} fields · ${r.questions_created} questions · ${r.mode}`)}catch(e){toast(e.message)}}async function publish(){try{await api(`/handovers/${current.handover.id}/publish`,{method:'POST'});await refresh();await openHandover(current.handover.id);toast('Approved view published')}catch(e){toast(e.message)}}
async function pasteSource(){const content=document.getElementById('pasteContent').value;if(!content.trim())return toast('Paste source text first');try{await api(`/handovers/${current.handover.id}/sources`,{method:'POST',body:JSON.stringify({name:document.getElementById('pasteName').value,content,source_type:'text',added_by:document.getElementById('pasteBy').value})});await reloadDetail();tab='sources';render();toast('Resource saved and indexed')}catch(e){toast(e.message)}}async function deleteSource(id){if(!confirm("Remove this resource? Fields supported only by it will be reset to Missing."))return;try{await api(`/handovers/${current.handover.id}/sources/${id}`,{method:"DELETE"});await reloadDetail();tab="sources";render();toast("Resource removed; affected citations were invalidated")}catch(e){toast(e.message)}}async function uploadResource(file){if(!file)return;const f=new FormData();f.append('file',file);try{await api(`/handovers/${current.handover.id}/upload`,{method:'POST',body:f});await reloadDetail();tab='sources';render();toast('Resource parsed and indexed')}catch(e){toast(e.message)}}async function answerQuestion(id){const answer=document.getElementById(`answer_${id}`).value.trim();if(!answer)return toast('Add the missing context');try{await api(`/questions/${id}/answer`,{method:'POST',body:JSON.stringify({answer,answered_by:current.handover.departing_person})});await reloadDetail();tab='questions';render();toast('Answer saved into template field')}catch(e){toast(e.message)}}
async function askQuestion(){const q=document.getElementById('customerQuestion').value.trim();if(!q)return toast('Enter a project question');const box=document.getElementById('answerBox');box.innerHTML='<div class="empty">Searching references…</div>';try{const a=await api(`/handovers/${current.handover.id}/ask`,{method:'POST',body:JSON.stringify({question:q})});box.innerHTML=`<div class="citation" style="margin-top:13px;white-space:pre-wrap"><b>${esc(a.mode==='abstained'?'No approved source · follow-up needed':a.mode==='source-excerpts'?'Relevant source excerpts':'Draft answer')}</b><br><br>${esc(a.answer)}${a.mode==='abstained'?'<br><br>Question saved in the incoming engineer log. Add or approve the missing context, then republish.':''}${a.citations.map(c=>`<div style="margin-top:8px"><a href="#" onclick="tab='sources';render();return false">${esc(c.passage_id)}</a> · “${esc(c.quote)}”</div>`).join('')}</div>`;await loadQaHistory()}catch(e){box.innerHTML='';toast(e.message)}}
async function teamPage(){canvas.innerHTML=`<div class="hero"><div><div class="eyebrow">Clear responsibility, least access</div><h1>Team accounts</h1><p>Add intern / builder and incoming engineer accounts. Assign them to each handover; each role gets a separate portal.</p></div></div><div class="split"><div class="card"><div class="card-head"><div><h2>Workspace people</h2><p>Only the Senior reviewer can create accounts and assign handovers.</p></div></div><div id="teamRows" class="list">Loading accounts…</div></div><div class="card"><div class="card-head"><div><h2>Add a teammate</h2><p>Share the temporary password securely out of band.</p></div></div><form class="form" id="userForm"><div class="field"><label>Full name</label><input name="display_name" required></div><div class="field"><label>Work email</label><input name="email" type="email" required></div><div class="field"><label>Role</label><select name="role"><option value="employee">Intern / builder</option><option value="recipient">Incoming engineer</option></select></div><div class="field"><label>Temporary password · 12 characters minimum</label><input name="temporary_password" type="password" minlength="12" required></div><button class="button primary">Create account</button></form></div></div>`;try{team=await api('/users');document.getElementById('teamRows').innerHTML=team.map(u=>`<div class="handover" style="cursor:default"><div class="avatar">${esc(u.display_name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div><div class="h-title">${esc(u.display_name)}</div><div class="h-meta">${esc(u.email)}</div></div><span class="state">${esc(u.role)}</span></div>`).join('')||'<div class="empty">No accounts found.</div>';document.getElementById('userForm').onsubmit=async e=>{e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();await teamPage();toast('Account created. Share login details privately.')}catch(x){toast(x.message)}}}catch(e){toast(e.message)}}
let versions=[];async function loadVersions(){try{versions=await api(`/handovers/${current.handover.id}/versions`);tab='versions';render()}catch(e){toast(e.message)}}function versionTab(){return `<div class="card"><div class="card-head"><div><h2>Published versions</h2><p>Each owner publication is saved as a snapshot.</p></div></div><div class="list">${versions.map(v=>`<div class="handover" style="cursor:default"><div class="h-icon">v${v.version}</div><div><div class="h-title">${esc(v.note)}</div><div class="h-meta">${new Date(v.created_at).toLocaleString()} · ${v.snapshot.fields.length} shared fields</div></div><span class="state Published">Published</span></div>`).join('')||'<div class="empty">No published versions yet.</div>'}</div></div>`}async function acknowledgeReceipt(){try{await api(`/handovers/${current.handover.id}/acknowledge`,{method:'POST',body:JSON.stringify({name:current.handover.recipient})});closeModal();await openHandover(current.handover.id);toast('Receipt acknowledged')}catch(e){toast(e.message)}}
async function recipientView(){try{const r=await api(`/handovers/${current.handover.id}/recipient`);openModal(`<div class="modal-head"><h2>Recipient view · ${esc(r.handover.title)}</h2><button class="x" onclick="closeModal()">×</button></div><div class="form">${r.fields.map(f=>`<div class="field-card"><div class="field-top"><b>${esc(f.label)}</b><span class="status ${esc(f.state)}">${esc(f.state)}</span></div><div class="field-content">${esc(f.value)}${f.citations.map(c=>`<div class="citation">${esc(c.passage_id)} · “${esc(c.quote)}”</div>`).join('')}</div></div>`).join('')||'<div class="empty">No approved content shared yet.</div>'}<button class="button primary" onclick="acknowledgeReceipt()">${r.handover.acknowledged_at?'Receipt acknowledged ✓':'Acknowledge receipt'}</button></div>`)}catch(e){toast(e.message)}}
function go(p){pageName=p;render();document.getElementById('sidebar').classList.remove('open')}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();if(pageName!=='handovers')go('handovers');document.querySelectorAll('.handover').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'':'none')};async function logout(){await api('/auth/logout',{method:'POST'});location.href='/login'}window.logout=logout;window.newHandover=newHandover;window.openHandover=openHandover;window.editTemplate=editTemplate;window.addEditorField=addEditorField;window.closeModal=closeModal;window.go=go;window.saveField=saveField;window.approveField=approveField;window.extract=extract;window.publish=publish;window.pasteSource=pasteSource;window.uploadResource=uploadResource;window.answerQuestion=answerQuestion;window.askQuestion=askQuestion;window.recipientView=recipientView;
refresh().catch(e=>canvas.innerHTML=`<div class="empty">Could not load Knowledge Continuity API: ${esc(e.message)}</div>`);
</script></body></html>
