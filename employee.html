<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My handovers · Knowledge Continuity</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--wine:#7c0919;--ink:#242123;--muted:#797479;--line:#e9e6e4;--paper:#f8f7f5;--green:#2e7355;--amber:#96631b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:228px 1fr}.side{background:white;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{font:800 16px Manrope;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}.mark{width:30px;height:30px;border-radius:9px;background:var(--wine);color:#fff;display:grid;place-items:center}.role{background:#f8edef;color:var(--wine);padding:10px;border-radius:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.navlabel{font-size:9px;text-transform:uppercase;color:#999;letter-spacing:1.4px}.nav{display:grid;gap:5px}.nav button{border:0;background:none;text-align:left;padding:10px;border-radius:8px;color:#6e696e;font-size:10px}.nav button.active,.nav button:hover{background:#f7edef;color:var(--wine);font-weight:700}.push{margin-top:auto}.profile{border-top:1px solid var(--line);padding-top:13px;display:flex;gap:8px;align-items:center}.avatar{width:29px;height:29px;border-radius:50%;background:#e9d9d3;color:#704d44;display:grid;place-items:center;font-size:9px;font-weight:700}.profile b{font-size:10px;display:block}.profile small{font-size:8px;color:var(--muted)}.profile button{margin-left:auto;border:0;background:none;color:var(--wine);font-size:9px}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.crumb{font-size:10px;color:var(--muted)}.main{max-width:1050px;padding:32px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px;gap:15px}.kicker{font-size:9px;color:var(--wine);letter-spacing:1.5px;text-transform:uppercase;font-weight:700}.hero h1{font:700 27px Manrope;letter-spacing:-.8px;margin:7px 0 4px}.hero p{font-size:10px;color:var(--muted);margin:0;line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:11px}.head{padding:15px 16px;border-bottom:1px solid #f1efed}.head h2{font:700 12px Manrope;margin:0}.head p{font-size:9px;color:var(--muted);margin:4px 0 0}.item{padding:14px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #f3f1ef;cursor:pointer}.item:last-child{border:0}.item:hover{background:#fcfaf9}.icon{width:34px;height:34px;border-radius:9px;background:#f7edef;color:var(--wine);display:grid;place-items:center}.item b{font-size:10px}.item small{display:block;font-size:8px;color:var(--muted);margin-top:4px}.state{margin-left:auto;font-size:8px;padding:4px 7px;border-radius:14px;background:#f1eff1;color:#746f75}.state.Submitted,.state.In.review{background:#fff4e2;color:var(--amber)}.state.Published{background:#eaf4ed;color:var(--green)}.button{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;font-size:9px;font-weight:700;color:#504b50}.primary{color:white;background:var(--wine);border-color:var(--wine)}.empty{padding:30px;text-align:center;color:var(--muted);font-size:10px;line-height:1.6}.worktop{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:17px}.worktop h1{font:700 23px Manrope;letter-spacing:-.6px;margin:7px 0}.worktop p{font-size:9px;color:var(--muted)}.tabs{display:flex;gap:15px;border-bottom:1px solid var(--line);margin:14px 0}.tabs button{border:0;background:none;padding:9px 3px;font-size:9px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--wine);border-color:var(--wine);font-weight:700}.field{border:1px solid var(--line);border-radius:9px;background:white;margin:8px 0}.fieldhead{padding:10px 12px;border-bottom:1px solid #f1efed;display:flex;justify-content:space-between}.fieldhead b{font-size:10px}.badge{font-size:8px;color:#706c73}.badge.Found{color:var(--green)}.badge.Inferred{color:var(--amber)}.fieldbody{padding:11px 12px}.fieldbody textarea,.answer{width:100%;min-height:65px;border:1px solid var(--line);border-radius:7px;padding:8px;font-size:10px;line-height:1.5}.citation{margin:7px 0;padding:7px 9px;border-left:2px solid #c69ba1;background:#fcf9f9;font-size:9px;color:#655e61}.source{padding:11px;border-bottom:1px solid #f1efed;font-size:10px}.source small{display:block;color:var(--muted);font-size:8px;margin-top:4px}.form{padding:15px}.form label{display:block;font-size:9px;font-weight:700;margin:9px 0 5px}.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;font-size:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,15px);background:#211a1c;color:#fff;border-radius:8px;padding:10px 14px;font-size:10px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.layout{display:block}.side{position:fixed;bottom:0;left:0;right:0;height:58px;padding:7px 12px;z-index:4;display:block;border:0;border-top:1px solid var(--line)}.brand,.role,.navlabel,.push{display:none}.nav{display:flex;justify-content:space-around}.nav button{font-size:9px}.profile{display:none}.top{height:55px;padding:0 14px}.main{padding:21px 13px 80px}.hero,.worktop{align-items:flex-start;flex-direction:column}.hero h1{font-size:23px}.hero .button{width:100%}.tabs{overflow:auto}.tabs button{white-space:nowrap}}
</style></head><body><div class="layout"><aside class="side"><a class="brand" href="/"><span class="mark">K</span>Knowledge Continuity</a><div class="role">Intern workspace</div><div class="navlabel">Your work</div><nav class="nav"><button class="active">▦ &nbsp; My handovers</button><button onclick="loadCurrent()">✎ &nbsp; Continue draft</button></nav><div class="push"><div style="font-size:9px;color:#888;line-height:1.6;padding:8px">Your work is private to the assigned project team until the owner publishes it.</div><div class="profile"><div class="avatar" id="avatar">E</div><div><b id="userName">Employee</b><small id="userEmail">—</small></div><button onclick="logout()">Sign out</button></div></div></aside><main><header class="top"><span class="crumb">Intern portal / <b>My handovers</b></span><span class="kicker">Prepare · Explain · Submit</span></header><section class="main" id="main"><div class="empty">Loading your assignments…</div></section></main></div><div class="toast" id="toast"></div><script>
const API='/api/kc';let me=null,items=[],current=null,tab='fields';const main=document.getElementById('main');async function api(p,o={}){const r=await fetch(API+p,{...o,credentials:'same-origin',headers:{...(o.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(o.headers||{})}});let d;try{d=await r.json()}catch{d={detail:'Request failed'}}if(r.status===401){location.href='/login';throw Error('Sign in again')}if(!r.ok)throw Error(d.detail||'Request failed');return d}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}async function init(){try{me=(await api('/auth/me')).user;document.getElementById('userName').textContent=me.display_name;document.getElementById('userEmail').textContent=me.email;document.getElementById('avatar').textContent=me.display_name.split(' ').map(x=>x[0]).join('').slice(0,2);items=await api('/handovers');home()}catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function home(){main.innerHTML=`<div class="hero"><div><div class="kicker">Intern / project contributor</div><h1>Share what you built. Help the next engineer build forward.</h1><p>Keep your assigned handovers current. Add the resources you already use, explain decisions and open work, answer follow-up questions, then submit your draft to the owner.</p></div></div><div class="card"><div class="head"><h2>Assigned handovers</h2><p>${items.length} assignment(s) · Work stays in draft until you submit it.</p></div>${items.map(h=>`<div class="item" onclick="openWork('${h.id}')"><span class="icon">↗</span><div><b>${esc(h.title)}</b><small>${esc(h.template_name)} · ${h.source_count} resource(s) · ${h.missing_count} gaps</small></div><span class="state ${h.status.replace(' ',' .')}">${esc(h.status)}</span></div>`).join('')||'<div class="empty">No handovers assigned to your account yet.<br>Ask your senior reviewer to create a handover and assign it to your account.</div>'}</div>`}async function openWork(id){try{current=await api(`/handovers/${id}`);tab='fields';workspace()}catch(e){toast(e.message)}}function workspace(){const h=current.handover;main.innerHTML=`<div class="worktop"><div><button class="button" onclick="home()">← My handovers</button><div class="kicker" style="margin-top:12px">${esc(h.status)} · Assigned handover</div><h1>${esc(h.title)}</h1><p>Senior reviewer: ${esc(h.owner)} · Recipient: ${esc(h.recipient)}</p></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="button" onclick="document.getElementById('file').click()">＋ Add resource</button><button class="button primary" onclick="extract()">Draft from sources ✳</button><input id="file" type="file" accept=".txt,.md,.csv,.json,.log,.html,.css,.js,.jsx,.ts,.tsx,.py,.sql,.yaml,.yml,.pdf,.docx" hidden onchange="uploadFile(this.files[0])"></div></div><div class="tabs"><button class="${tab==='fields'?'active':''}" onclick="tab='fields';workspace()">Template fields</button><button class="${tab==='resources'?'active':''}" onclick="tab='resources';workspace()">My resources (${current.sources.length})</button><button class="${tab==='questions'?'active':''}" onclick="tab='questions';workspace()">Senior questions (${current.questions.filter(q=>q.status==='Open').length})</button><button class="${tab==='timeline'?'active':''}" onclick="tab='timeline';workspace()">Timeline</button></div>${tab==='fields'?fieldsPage():tab==='resources'?resourcesPage():tab==='questions'?questionsPage():timelinePage()}`}
function timelinePage(){setTimeout(loadTimeline,0);return `<div class="card"><div class="head"><h2>Project timeline</h2><p>Use dated notes, issues, release notes, or commit history to preserve when work happened. Only dates written in the sources are placed on the project timeline.</p></div><div id="timelineBody"><div class="empty">Loading timeline...</div></div></div>`}
async function loadTimeline(){const box=document.getElementById('timelineBody');if(!box||!current)return;try{const d=await api(`/handovers/${current.handover.id}/timeline`);box.innerHTML=`${d.evidence.map(e=>`<div class="citation"><b>${esc(e.date)}</b> | ${esc(e.kind)} | ${esc(e.source)}<p>${esc(e.quote)}</p><small>${esc(e.passage_id)} | Explicit date in source</small></div>`).join('')||'<div class="empty">No complete dates found in these sources yet. Add dated project notes or an issue/release export to establish chronology.</div>'}<details class="form"><summary>Workspace activity (${d.activity.length})</summary><p>${esc(d.date_rule)}</p>${d.activity.map(a=>`<div class="source"><b>${esc(a.label)}</b> | ${esc(a.at)}<small>${esc(a.detail)}</small></div>`).join('')}</details>`}catch(e){box.innerHTML=`<div class="empty">Could not load timeline: ${esc(e.message)}</div>`}}
function fieldsPage(){return `<div class="card"><div class="head"><h2>Complete the handover</h2><p>Use your own words. Add enough context for someone unfamiliar with this work.</p></div><div class="form">${current.fields.map(f=>`<article class="field"><div class="fieldhead"><b>${esc(f.label)}</b><span class="badge ${esc(f.state)}">${esc(f.state)}${f.approved?' · Approved':''}</span></div><div class="fieldbody"><textarea id="v_${f.id}" placeholder="Add what the next person needs to know…">${esc(f.value)}</textarea>${f.citations.map(c=>`<div class="citation">Source ${esc(c.passage_id)} · “${esc(c.quote)}”</div>`).join('')}<button class="button" style="margin-top:7px" onclick="save('${f.id}')">Save field</button></div></article>`).join('')}</div><div class="head" style="border-top:1px solid #eee"><button class="button primary" onclick="submitHandover()">Submit to owner for review →</button><span style="font-size:8px;color:#888;margin-left:10px">You cannot publish or approve your own handover.</span></div></div>`}
function resourcesPage(){return `<div class="card"><div class="head"><h2>Project resources</h2><p>Add authorized code files, README notes, issue exports, and chats. Original uploads are saved privately; extracted text is indexed for citations. Never upload .env files or credentials.</p></div>${current.sources.map(s=>`<div class="source"><b>${esc(s.name)}</b><small>${esc(s.source_type)} · Added by ${esc(s.added_by)} · ${esc(s.audience)}${s.size?` · ${(s.size/1024).toFixed(1)} KB`:``}</small>${s.download_url?`<a class="button" style="margin-top:6px" href="${esc(s.download_url)}">Download original</a>`:``}<button class="button" style="margin-top:6px" onclick="removeSource('${s.id}')">Remove resource</button></div>`).join('')||'<div class="empty">No resources yet. Add a note or upload a project file to start.</div>'}<div class="form"><label>Paste notes, meeting context, or task export</label><input id="sourceName" value="Project notes" aria-label="Resource title"><textarea id="sourceText" placeholder="What works, what is mocked, how do I run it, what did I test, and what should be built next?" style="min-height:120px;margin-top:8px"></textarea><button class="button primary" style="margin-top:8px" onclick="addText()">Save resource</button></div></div>`}
function questionsPage(){return `<div class="card"><div class="head"><h2>Questions from your owner</h2><p>Short answers are helpful. These answers become part of the source record.</p></div><div class="form">${current.questions.map(q=>`<div class="field"><b style="font-size:10px">${esc(q.question)}</b><small style="display:block;color:#888;margin:5px 0">${esc(q.field_label)} · ${esc(q.status)}</small>${q.status==='Open'?`<textarea id="a_${q.id}" placeholder="Add context for this field…"></textarea><button class="button primary" style="margin-top:6px" onclick="answer('${q.id}')">Send answer</button>`:`<div class="citation">${esc(q.answer)}</div>`}</div>`).join('')||'<div class="empty">No follow-up questions. Your owner will ask here if context is missing.</div>'}</div></div>`}
async function reload(){current=await api(`/handovers/${current.handover.id}`);workspace()}async function save(id){try{await api(`/fields/${id}`,{method:'PATCH',body:JSON.stringify({value:document.getElementById('v_'+id).value,state:'Manual'})});await reload();toast('Field saved')}catch(e){toast(e.message)}}async function addText(){const content=document.getElementById('sourceText').value;if(!content.trim())return toast('Add source text first');try{await api(`/handovers/${current.handover.id}/sources`,{method:'POST',body:JSON.stringify({name:document.getElementById('sourceName').value,content,source_type:'text',added_by:me.display_name})});await reload();tab='resources';workspace();toast('Resource added')}catch(e){toast(e.message)}}async function removeSource(id){if(!confirm("Remove this resource? Fields supported only by it will be reset to Missing."))return;try{await api(`/handovers/${current.handover.id}/sources/${id}`,{method:"DELETE"});await reload();tab="resources";workspace();toast("Resource removed; affected citations were invalidated")}catch(e){toast(e.message)}}async function uploadFile(file){if(!file)return;const f=new FormData();f.append('file',file);try{await api(`/handovers/${current.handover.id}/upload`,{method:'POST',body:f});await reload();tab='resources';workspace();toast('Resource uploaded and indexed')}catch(e){toast(e.message)}}async function extract(){try{const d=await api(`/handovers/${current.handover.id}/extract`,{method:'POST'});await reload();tab='fields';workspace();toast(`Draft generated · ${d.questions_created} questions to resolve`)}catch(e){toast(e.message)}}async function answer(id){const answer=document.getElementById('a_'+id).value.trim();if(!answer)return toast('Write a short answer');try{await api(`/questions/${id}/answer`,{method:'POST',body:JSON.stringify({answer,answered_by:me.display_name})});await reload();tab='questions';workspace();toast('Answer sent to owner')}catch(e){toast(e.message)}}async function submitHandover(){try{await api(`/handovers/${current.handover.id}/submit`,{method:'POST'});items=await api('/handovers');await openWork(current.handover.id);toast('Submitted to owner for review')}catch(e){toast(e.message)}}async function logout(){await api('/auth/logout',{method:'POST'});location.href='/login'}init();
</script></body></html>
