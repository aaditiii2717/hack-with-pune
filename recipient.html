<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared handovers Â· Knowledge Continuity</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--wine:#7c0919;--ink:#242123;--muted:#797479;--line:#e9e6e4;--paper:#f8f7f5;--green:#2e7355}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:225px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:23px 15px;display:flex;flex-direction:column;gap:23px}.brand{font:800 15px Manrope;display:flex;align-items:center;gap:9px}.mark{width:29px;height:29px;background:var(--wine);color:white;border-radius:9px;display:grid;place-items:center}.role{padding:9px;background:#eaf4ed;color:var(--green);border-radius:8px;font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.navlabel{font-size:9px;color:#999;letter-spacing:1.3px;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{border:0;background:none;text-align:left;padding:10px;border-radius:8px;color:#6e696e;font-size:10px}.nav button.active,.nav button:hover{background:#f7edef;color:var(--wine)}.profile{margin-top:auto;border-top:1px solid var(--line);padding-top:13px;display:flex;align-items:center;gap:8px}.avatar{width:29px;height:29px;border-radius:50%;background:#e9d9d3;color:#704d44;display:grid;place-items:center;font-size:9px;font-weight:700}.profile b{font-size:9px;display:block}.profile small{font-size:8px;color:var(--muted)}.profile button{margin-left:auto;border:0;background:none;color:var(--wine);font-size:8px}.top{height:61px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 29px}.crumb{font-size:10px;color:var(--muted)}.main{max-width:1050px;margin:auto;padding:31px}.hero{margin-bottom:20px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--wine);font-weight:700}.hero h1{font:700 26px Manrope;letter-spacing:-.7px;margin:8px 0 5px}.hero p{font-size:10px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:10px}.head{padding:15px;border-bottom:1px solid #f1efed}.head h2{font:700 12px Manrope;margin:0}.head p{font-size:9px;color:var(--muted);margin:4px 0 0}.item{padding:13px 15px;border-bottom:1px solid #f1efed;display:flex;align-items:center;gap:10px;cursor:pointer}.item:hover{background:#fcfaf9}.icon{width:33px;height:33px;border-radius:9px;background:#f6edef;color:var(--wine);display:grid;place-items:center}.item b{font-size:10px}.item small{display:block;color:var(--muted);font-size:8px;margin-top:4px}.button{border:1px solid var(--line);background:white;border-radius:7px;padding:9px 12px;font-size:9px;font-weight:700}.primary{background:var(--wine);border-color:var(--wine);color:white}.empty{padding:28px;text-align:center;color:var(--muted);font-size:10px;line-height:1.6}.detailtop{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:17px}.detailtop h1{font:700 22px Manrope;margin:8px 0}.detailtop p{font-size:9px;color:var(--muted)}.tabs{display:flex;gap:15px;border-bottom:1px solid var(--line);margin:13px 0}.tabs button{border:0;background:none;padding:9px 3px;border-bottom:2px solid transparent;color:var(--muted);font-size:9px}.tabs button.active{border-color:var(--wine);color:var(--wine);font-weight:700}.field{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:white}.fieldhead{padding:10px 12px;border-bottom:1px solid #f1efed;display:flex;justify-content:space-between}.fieldhead b{font-size:10px}.approved{font-size:8px;color:var(--green)}.fieldbody{padding:11px 12px;font-size:10px;line-height:1.65;white-space:pre-wrap}.cite{margin-top:7px;padding:7px 9px;background:#fcf9f9;border-left:2px solid #c69ba1;color:#655e61;font-size:9px}.qa{padding:15px}.qa textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:10px}.answer{margin-top:12px;padding:12px;background:#faf8f6;border-radius:8px;font-size:10px;line-height:1.65;white-space:pre-wrap}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,15px);background:#211a1c;color:white;padding:10px 14px;border-radius:8px;font-size:10px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:680px){.layout{display:block}.side{position:fixed;bottom:0;left:0;right:0;height:57px;padding:7px;z-index:3;display:block;border:0;border-top:1px solid var(--line)}.brand,.role,.navlabel,.profile{display:none}.nav{display:flex;justify-content:space-around}.nav button{font-size:9px}.top{height:54px;padding:0 13px}.main{padding:21px 13px 75px}.detailtop{flex-direction:column}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><span class="mark">K</span>Knowledge Continuity</div><div class="role">Incoming engineer</div><div class="navlabel">Your continuity</div><nav class="nav"><button class="active" onclick="home()">â–¦ &nbsp; Shared handovers</button><button onclick="openCurrentQa()">âœ³ &nbsp; Ask about handover</button></nav><div class="profile"><div class="avatar" id="avatar">R</div><div><b id="userName">Recipient</b><small id="email">â€”</small></div><button onclick="logout()">Sign out</button></div></aside><main><header class="top"><span class="crumb">Incoming engineer portal / <b>Approved knowledge</b></span><span class="kicker">Read Â· Ask Â· Acknowledge</span></header><section class="main" id="main"><div class="empty">Loading shared knowledgeâ€¦</div></section></main></div><div class="toast" id="toast"></div><script>
const API='/api/kc';let me=null,items=[],current=null,tab='fields';const main=document.getElementById('main');async function api(p,o={}){const r=await fetch(API+p,{...o,credentials:'same-origin',headers:{...(o.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(o.headers||{})}});let d;try{d=await r.json()}catch{d={detail:'Request failed'}}if(r.status===401){location.href='/login';throw Error('Sign in again')}if(!r.ok)throw Error(d.detail||'Request failed');return d}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}async function init(){try{me=(await api('/auth/me')).user;document.getElementById('userName').textContent=me.display_name;document.getElementById('email').textContent=me.email;document.getElementById('avatar').textContent=me.display_name.split(' ').map(x=>x[0]).join('').slice(0,2);items=await api('/handovers');home()}catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function home(){main.innerHTML=`<div class="hero"><div class="kicker">Recipient / incoming teammate</div><h1>Start with the context your team kept.</h1><p>These are the handovers your owner has reviewed and shared with you. Only approved sections appear here.</p></div><div class="card"><div class="head"><h2>Shared with you</h2><p>${items.length} published handover(s)</p></div>${items.map(h=>`<div class="item" onclick="openWork('${h.id}')"><span class="icon">âœ“</span><div><b>${esc(h.title)}</b><small>${esc(h.template_name)} Â· From ${esc(h.departing_person)} Â· ${h.source_count} referenced resource(s)</small></div><span style="margin-left:auto;color:#2e7355;font-size:8px">${h.acknowledged_at?'ACKNOWLEDGED':'NEW'}</span></div>`).join('')||'<div class="empty">No handovers have been shared with this account yet.<br>Your senior reviewer will publish approved context here.</div>'}</div>`}async function openWork(id){try{current=await api(`/handovers/${id}/recipient`);tab='fields';workspace()}catch(e){toast(e.message)}}function workspace(){const h=current.handover;main.innerHTML=`<div class="detailtop"><div><button class="button" onclick="home()">â† Shared handovers</button><div class="kicker" style="margin-top:10px">Owner-approved Â· ${current.fields.length} sections shared</div><h1>${esc(h.title)}</h1><p>Prepared by ${esc(h.departing_person)} Â· Senior reviewer ${esc(h.owner)}${h.acknowledged_at?' Â· Receipt acknowledged':''}</p></div><button class="button primary" onclick="acknowledge()">${h.acknowledged_at?'Acknowledged âœ“':'Acknowledge receipt'}</button></div><div class="tabs"><button class="${tab==='fields'?'active':''}" onclick="tab='fields';workspace()">Handover</button><button class="${tab==='qa'?'active':''}" onclick="tab='qa';workspace()">Ask about handover</button><button class="${tab==='timeline'?'active':''}" onclick="tab='timeline';workspace()">Timeline</button></div>${tab==='fields'?fieldsPage():tab==='qa'?qaPage():timelinePage()}`}
function timelinePage(){setTimeout(loadTimeline,0);return `<div class="card"><div class="head"><h2>Project timeline</h2><p>Only dates written in an owner-approved source excerpt appear here. Workspace timestamps are listed separately.</p></div><div id="timelineBody"><div class="empty">Loading approved timeline...</div></div></div>`}
async function loadTimeline(){const box=document.getElementById('timelineBody');if(!box||!current)return;try{const d=await api(`/handovers/${current.handover.id}/timeline`);box.innerHTML=`${d.evidence.map(e=>`<div class="cite"><b>${esc(e.date)}</b> | ${esc(e.kind)} | ${esc(e.source)}<p>${esc(e.quote)}</p><small>${esc(e.passage_id)} | Approved source</small></div>`).join('')||'<div class="empty">No dated evidence was included in the approved handover. Ask the senior reviewer to approve relevant dated context.</div>'}<details class="qa"><summary>Handover activity (${d.activity.length})</summary><p>${esc(d.date_rule)}</p>${d.activity.map(a=>`<div class="cite"><b>${esc(a.label)}</b> | ${esc(a.at)}<p>${esc(a.detail)}</p></div>`).join('')}</details>`}catch(e){box.innerHTML=`<div class="empty">Could not load timeline: ${esc(e.message)}</div>`}}
function fieldsPage(){return `<div class="card"><div class="head"><h2>Approved project context</h2><p>Each section is approved by the owner and linked to its supporting source.</p></div><div style="padding:8px 13px">${current.fields.map(f=>`<article class="field"><div class="fieldhead"><b>${esc(f.label)}</b><span class="approved">OWNER APPROVED</span></div><div class="fieldbody">${esc(f.value)}${f.citations.map(c=>`<div class="cite">Source ${esc(c.passage_id)} Â· â€œ${esc(c.quote)}â€</div>`).join('')}</div></article>`).join('')||'<div class="empty">No approved sections were shared.</div>'}</div></div>`}
function qaPage(){return `<div class="card"><div class="head"><h2>Ask from the approved references</h2><p>Ask about setup, formulas, tests, or open work. Answers use only senior-approved sources. If a source is missing, your question is recorded for the senior reviewer to follow up.</p></div><div class="qa"><textarea id="q" placeholder="How do I run the calculator locally? Which formula assumptions are still unverified?"></textarea><button class="button primary" style="margin-top:8px" onclick="ask()">Find a sourced answer â†’</button><div id="a"></div></div></div>`}
async function ask(){const question=document.getElementById('q').value.trim();if(!question)return toast('Enter a project question');const box=document.getElementById('a');box.innerHTML='<div class="answer">Searching approved contextâ€¦</div>';try{const r=await api(`/handovers/${current.handover.id}/ask`,{method:'POST',body:JSON.stringify({question})});box.innerHTML=`<div class="answer"><b>${r.mode==='abstained'?'No approved source · senior follow-up requested':r.mode==='source-excerpts'?'Relevant approved source excerpts':'Draft answer Â· verify before sending'}</b><br><br>${esc(r.answer)}${r.mode==='abstained'?'<br><br>Your question was recorded for the senior reviewer. Check back after the handover is updated and republished.':''}${r.citations.map(c=>`<div class="cite">${esc(c.passage_id)} Â· â€œ${esc(c.quote)}â€</div>`).join('')}</div>`}catch(e){box.innerHTML='';toast(e.message)}}async function acknowledge(){if(current.handover.acknowledged_at)return;try{await api(`/handovers/${current.handover.id}/acknowledge`,{method:'POST',body:JSON.stringify({name:me.display_name})});current=await api(`/handovers/${current.handover.id}/recipient`);items=await api('/handovers');workspace();toast('Receipt recorded')}catch(e){toast(e.message)}}function openCurrentQa(){if(current){tab='qa';workspace()}else if(items.length)openWork(items[0].id);else toast('No shared handovers yet')}async function logout(){await api('/auth/logout',{method:'POST'});location.href='/login'}init();
</script></body></html>
